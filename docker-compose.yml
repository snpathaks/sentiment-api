

services:

  sentiment-api:
    build:
      context: .
      dockerfile: Dockerfile
   
      args:
        MODEL_NAME: ${MODEL_NAME:-cardiffnlp/twitter-roberta-base-sentiment-latest}

    image: sentiment-as-a-service:latest
    container_name: sentiment-api

    ports:
      - "${HOST_PORT:-8000}:8000"

    environment:

      TRANSFORMERS_OFFLINE: "1"
    
      LOG_LEVEL: ${LOG_LEVEL:-info}

    deploy:
      resources:
        limits:
          
          memory: 2g
        reservations:
          memory: 512m

  
    restart: unless-stopped


    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\"" ]
      interval: 30s
      timeout: 10s
    
      start_period: 60s

 
    volumes:
      - hf-model-cache:/model-cache

   
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


volumes:
  hf-model-cache:
    driver: local
